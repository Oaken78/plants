<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overgrowth Plant Demo</title>
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --ink: #2b3242;
      --paper: #f4efe2;
      --rust: #c4573a;
      --blue: #3d7cc4;
      --panel: rgba(244, 239, 226, 0.9);
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #c4e4f4; font: 13px/1.4 system-ui, sans-serif; color: var(--ink); }
    canvas { display: block; cursor: crosshair; }
    .panel { position: fixed; background: var(--panel); border: 1.5px solid var(--ink); border-radius: 6px; padding: 10px 12px; box-shadow: 3px 3px 0 rgba(43, 50, 66, 0.25); }
    #hud { left: 12px; top: 12px; width: 290px; }
    #hud h1 { margin: 0 0 2px; font-size: 16px; letter-spacing: 0.02em; }
    #hud h1 span { color: var(--rust); }
    #stats { margin: 6px 0; white-space: pre; font: 11.5px/1.45 ui-monospace, Consolas, monospace; }
    #gen { font-size: 11.5px; opacity: 0.85; }
    #controls { right: 12px; top: 12px; width: 300px; max-height: calc(100vh - 48px); overflow: auto; }
    .row { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 8px; margin: 4px 0; }
    .row input[type=range] { width: 100%; }
    .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; margin: 6px 0; }
    button { font: inherit; background: var(--ink); color: var(--paper); border: 0; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
    button.alt { background: var(--rust); }
    button:hover { filter: brightness(1.15); }
    details { margin-top: 8px; }
    summary { cursor: pointer; font-weight: 600; }
    .param { display: grid; grid-template-columns: 1fr 90px 44px; align-items: center; gap: 6px; font-size: 11px; }
    .param input { width: 100%; }
    .param output { text-align: right; font-family: ui-monospace, Consolas, monospace; }
    #seed { width: 80px; font: inherit; }
    #help { left: 12px; bottom: 12px; font-size: 12px; }
    #help b { display: inline-block; min-width: 14px; padding: 0 4px; border: 1px solid var(--ink); border-radius: 3px; text-align: center; font-weight: 600; background: #fff8; }
    body.hide-ui .panel { display: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #c4e4f4; z-index: 10; }
    #loading div { padding: 18px 26px; background: var(--panel); border: 1.5px solid var(--ink); border-radius: 6px; font-size: 15px; }
    @media (max-width: 760px) {
      #controls { top: auto; bottom: 12px; width: calc(100% - 48px); max-height: 40vh; }
      #help { display: none; }
      #hud { width: calc(100% - 48px); }
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="loading"><div id="loading-text">Starting...</div></div>

  <div id="hud" class="panel">
    <h1>Overgrowth <span>/ plant generator</span></h1>
    <div id="stats"></div>
    <div id="gen"></div>
  </div>

  <div id="controls" class="panel">
    <div class="row"><span>Growth</span><input id="grow" type="range" min="0" max="1" step="0.001" value="1"></div>
    <div class="row"><span>Wind</span><input id="wind" type="range" min="0" max="3" step="0.01" value="1"></div>
    <div class="row"><span>Sun height</span><input id="sun-el" type="range" min="8" max="85" step="1" value="48"></div>
    <div class="row"><span>Sun direction</span><input id="sun-az" type="range" min="0" max="360" step="1" value="215"></div>
    <div class="row"><span>Resolution</span><input id="res" type="range" min="0.5" max="2" step="0.05" value="1"></div>
    <div class="toggles">
      <label><input id="lod-debug" type="checkbox"> LOD colours</label>
      <label><input id="shadows" type="checkbox" checked> Shadows</label>
      <label><input id="outlines" type="checkbox" checked> Ink outlines</label>
      <label><input id="leaf-lines" type="checkbox" checked> Leaf lines</label>
    </div>
    <div class="row"><button id="animate" class="alt">Animate growth</button><span></span></div>
    <details open>
      <summary>Hero house generator</summary>
      <div class="row" style="grid-template-columns: auto auto auto; justify-content: start">
        <input id="seed" type="number" value="1"><button id="regrow">Regrow</button><button id="reseed" class="alt">New seed</button>
      </div>
      <details>
        <summary>Parameters</summary>
        <div id="params"></div>
      </details>
    </details>
  </div>

  <div id="help" class="panel">
    Click to fly &middot; <b>W</b><b>A</b><b>S</b><b>D</b> move &middot; <b>Space</b>/<b>Q</b> up/down &middot; <b>Shift</b> boost &middot; wheel speed: <span id="speed"></span> m/s<br>
    <b>1</b>-<b>6</b> viewpoints &middot; <b>L</b> LOD colours &middot; <b>O</b> outlines &middot; <b>G</b> grow &middot; <b>R</b> new seed &middot; <b>H</b> hide UI
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
