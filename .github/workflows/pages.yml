# Publishes the fly-through demo to GitHub Pages on every push to main.
# The site is the web/ folder plus the three.js files it imports from ../node_modules.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assemble site
        run: |
          mkdir -p _site/node_modules/three/examples
          cp -r web _site/web
          cp -r node_modules/three/build _site/node_modules/three/build
          cp -r node_modules/three/examples/jsm _site/node_modules/three/examples/jsm
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Overgrowth</title><meta http-equiv="refresh" content="0; url=web/"><a href="web/">Open the demo</a>' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
